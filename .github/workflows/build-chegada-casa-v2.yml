name: Build Chegada Casa V2

on:
  push:
    branches: [ main ]
    paths:
      - 'chegada-casa/**'
      - '.github/workflows/build-chegada-casa-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar chave de assinatura de teste
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: chegada-casa-fast-debug-keystore-v1

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: chegada-casa
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: cp chegada-casa/app/build/outputs/apk/debug/app-debug.apk ChegadaCasa-Rapida.apk

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Chegada-Casa-Rapida-APK
          path: ChegadaCasa-Rapida.apk

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="chegada-casa-rapida-${{ github.run_number }}"
          gh release create "$TAG" ChegadaCasa-Rapida.apk --title "Chegada Casa Rápido" --notes "Versão de teste lado a lado com monitor de localização em primeiro plano para reduzir o atraso na chegada e áudio imediato." || true
