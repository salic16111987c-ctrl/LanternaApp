name: Build Chegada Casa V2

on:
  push:
    branches: [ main ]
    paths:
      - 'chegada-casa/**'
      - '.github/workflows/build-chegada-casa-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar chave de assinatura privada
        id: signing_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chegada-casa-fast-signing-key-v2

      - name: Provisionar chave privada de assinatura se necessário
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Chegada Casa Test,O=Chegada Casa,C=BR" \
              -keyalg RSA -keysize 3072 -validity 10000 >/dev/null 2>&1
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null

      - name: Guardar chave de assinatura para próximas atualizações
        if: steps.signing_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: chegada-casa-fast-signing-key-v2

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Aplicar otimização de bateria de forma verificável
        run: python3 chegada-casa/tools/apply_battery_optimization.py

      - name: Validar invariantes de segurança e caminhos de chegada
        run: python3 chegada-casa/tools/check_arrival_invariants.py

      - name: Compilar APK
        working-directory: chegada-casa
        run: gradle :app:assembleDebug --no-daemon

      - name: Preparar APK
        run: cp chegada-casa/app/build/outputs/apk/debug/app-debug.apk ChegadaCasa-Rapida.apk

      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Chegada-Casa-Rapida-APK
          path: ChegadaCasa-Rapida.apk

      - name: Persistir otimização após compilação aprovada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chegada-casa/app/src/main/java/com/cilassouza/chegadacasa/ArrivalMonitorService.java chegada-casa/tools/check_arrival_invariants.py
          if ! git diff --cached --quiet; then
            git commit -m "Persist adaptive 2.3 GPS optimization after passing build"
            git push origin HEAD:main
          fi

      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="chegada-casa-rapida-${{ github.run_number }}"
          gh release create "$TAG" ChegadaCasa-Rapida.apk --title "Chegada Casa Rápido" --notes "Versão 2.3: GPS econômico 6h–18h, econômico em casa e GPS rápido fora de casa à noite; configure 200 m e Somente à noite no app." || true
