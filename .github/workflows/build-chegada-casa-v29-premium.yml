name: Build Chegada Casa 2.9 Premium UI

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-chegada-casa-v29-premium.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar chave de assinatura atual
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chegada-casa-fast-signing-key-v2
      - name: Garantir chave de assinatura
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Chegada Casa Test,O=Chegada Casa,C=BR" \
              -keyalg RSA -keysize 3072 -validity 10000 >/dev/null 2>&1
          fi
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Criar variante 2.9 de teste
        run: |
          python3 - <<'PY'
          from pathlib import Path
          g=Path('chegada-casa/app/build.gradle')
          s=g.read_text()
          s=s.replace("applicationId 'com.cilassouza.chegadacasa.fast'", "applicationId 'com.cilassouza.chegadacasa.fast28ui'")
          s=s.replace("versionName '2.9-interface-premium'", "versionName '2.9-interface-premium-teste'")
          g.write_text(s)
          m=Path('chegada-casa/app/src/main/AndroidManifest.xml')
          s=m.read_text()
          s=s.replace('android:label="Chegada Casa Rápido"', 'android:label="Chegada Casa 2.9 TESTE"')
          m.write_text(s)
          PY
      - name: Compilar APK 2.9
        working-directory: chegada-casa
        run: gradle :app:assembleDebug --no-daemon
      - name: Preparar APK
        run: cp chegada-casa/app/build/outputs/apk/debug/app-debug.apk ChegadaCasa-Rapida-v2.9-Premium-TESTE.apk
      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Chegada-Casa-Rapida-v2.9-Premium-TESTE
          path: ChegadaCasa-Rapida-v2.9-Premium-TESTE.apk
