name: Build OnCar Diagnostico APK

on:
  push:
    branches: [ oncar-diagnostico-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar projeto OnCar Diagnostico
        shell: bash
        run: |
          base64 -d oncar_source.b64 > /tmp/oncar.zip
          rm -rf /tmp/oncar-src
          mkdir -p /tmp/oncar-src
          unzip -q /tmp/oncar.zip -d /tmp/oncar-src

      - name: Instalar SDK Android 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Compilar APK
        working-directory: /tmp/oncar-src/OnCarDiagnostico/android
        run: gradle assembleDebug --no-daemon

      - name: Preparar APK
        run: cp /tmp/oncar-src/OnCarDiagnostico/android/app/build/outputs/apk/debug/app-debug.apk OnCarDiagnostico.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: OnCar-Diagnostico-APK
          path: OnCarDiagnostico.apk
