name: Build Chegada Casa 3.0 RC3 Transition

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-chegada-casa-v30-rc3-sideby.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Restaurar chave temporária atual
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: chegada-casa-fast-signing-key-v2
      - name: Garantir chave temporária atual
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -dname "CN=Chegada Casa Transition,O=Chegada Casa,C=BR" \
              -keyalg RSA -keysize 3072 -validity 10000 >/dev/null 2>&1
          fi
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Criar variante RC3 de transição
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('chegada-casa/app/build.gradle')
          s = gradle.read_text()
          s = s.replace("applicationId 'com.cilassouza.chegadacasa.fast'",
                        "applicationId 'com.cilassouza.chegadacasa.commercialrc3'")
          gradle.write_text(s)

          fixed = Path('chegada-casa/app/src/main/java/com/cilassouza/chegadacasa/FixedMainActivity.java')
          s = fixed.read_text()
          s = s.replace('private static final String OAUTH_STATE_PREFIX = "v3-";',
                        'private static final String OAUTH_STATE_PREFIX = "v3rc3-";')
          s = s.replace('private static final String OAUTH_SCHEME = "chegadacasav3";',
                        'private static final String OAUTH_SCHEME = "chegadacasav3rc3";')
          fixed.write_text(s)

          manifest = Path('chegada-casa/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          s = s.replace('android:scheme="chegadacasav3"',
                        'android:scheme="chegadacasav3rc3"')
          s = s.replace('android:label="Chegada Casa Rápido"',
                        'android:label="Chegada Casa Rápido RC3"')
          manifest.write_text(s)
          PY
      - name: Compilar APK RC3 transição
        working-directory: chegada-casa
        run: gradle :app:assembleDebug --no-daemon
      - name: Preparar APK
        run: cp chegada-casa/app/build/outputs/apk/debug/app-debug.apk ChegadaCasa-Rapida-v3.0-RC3-Transicao.apk
      - name: Salvar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Chegada-Casa-Rapida-v3.0-RC3-Transicao
          path: ChegadaCasa-Rapida-v3.0-RC3-Transicao.apk
