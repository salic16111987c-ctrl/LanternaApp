name: Build Caixa da Loja APK

on:
  push:
    branches:
      - caixa-loja-app
    paths:
      - 'CaixaLojaApp/**'
      - '.github/workflows/caixa-loja-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: CaixaLojaApp
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caixa-da-Loja-APK
          path: CaixaLojaApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
