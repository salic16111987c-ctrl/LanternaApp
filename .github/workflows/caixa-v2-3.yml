name: Build Tech Cell PDV Alpha9 Test

on:
  push:
    branches:
      - gestao-techcell-alpha8-test
    paths:
      - 'caixa-da-loja-v2-3/**'
      - '.github/workflows/caixa-v2-3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android platform
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare app icon
        working-directory: caixa-da-loja-v2-3
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d icon.b64 > app/src/main/res/drawable/ic_launcher.png

      - name: Build release APK
        working-directory: caixa-da-loja-v2-3
        run: gradle :app:assembleRelease --stacktrace

      - name: Copy signing utility
        working-directory: caixa-da-loja-v2-3
        run: |
          mkdir -p build-output
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-output/TechCell-PDV-Alpha9-Teste-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-output/apksigner.jar

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechCell-PDV-Alpha9-Teste-build
          path: caixa-da-loja-v2-3/build-output/
          retention-days: 7
