name: Build Tech Cell PDV Preview

on:
  push:
    branches:
      - gestao-techcell-pdv-preview
    paths:
      - 'caixa-da-loja-v2-3/**'
      - '.github/workflows/caixa-v2-3.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android platform
        run: |
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare app icon
        working-directory: caixa-da-loja-v2-3
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d icon.b64 > app/src/main/res/drawable/ic_launcher.png

      - name: Build release APK
        working-directory: caixa-da-loja-v2-3
        run: gradle :app:assembleRelease --stacktrace

      - name: Sign preview APK
        working-directory: caixa-da-loja-v2-3
        run: |
          mkdir -p build-output
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign             --ks test-signing.jks             --ks-key-alias techcelltest             --ks-pass pass:android             --key-pass pass:android             --out build-output/TechCell-PDV-Alpha24-Preview.apk             app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs             build-output/TechCell-PDV-Alpha24-Preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechCell-PDV-Alpha24-Preview
          path: caixa-da-loja-v2-3/build-output/TechCell-PDV-Alpha24-Preview.apk
          retention-days: 14
