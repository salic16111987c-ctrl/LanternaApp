name: Build Caixa da Loja APK

on:
  push:
    branches:
      - caixa-da-loja-build
    paths:
      - 'CaixaDaLojaAndroid/**'
      - '.github/workflows/build-caixa-da-loja-apk.yml'
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Embed updated Caixa da Loja
        shell: bash
        run: |
          mkdir -p CaixaDaLojaAndroid/app/src/main/assets
          printf '%s' '' | base64 -d | gzip -d > CaixaDaLojaAndroid/app/src/main/assets/index.html
          sed -i 's#https://caixa-da-loja-chegada-em-casa.vercel.app#file:///android_asset/index.html#' CaixaDaLojaAndroid/app/src/main/java/com/techcell/caixadaloja/MainActivity.java
          sed -i '/settings.setJavaScriptEnabled(true);/a\        settings.setAllowFileAccess(true);\n        settings.setAllowFileAccessFromFileURLs(true);\n        settings.setAllowUniversalAccessFromFileURLs(true);' CaixaDaLojaAndroid/app/src/main/java/com/techcell/caixadaloja/MainActivity.java

      - name: Setup stable app signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' '' | base64 -d > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 35
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: CaixaDaLojaAndroid
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp CaixaDaLojaAndroid/app/build/outputs/apk/debug/app-debug.apk Caixa_da_Loja_Admin_v2.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caixa-da-Loja-Admin-v2
          path: Caixa_da_Loja_Admin_v2.apk
          if-no-files-found: error
