name: Build Caixa da Loja APK

on:
  push:
    branches:
      - caixa-da-loja-build
    paths:
      - 'CaixaDaLojaAndroid/**'
      - '.github/workflows/build-caixa-da-loja-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: CaixaDaLojaAndroid
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: cp CaixaDaLojaAndroid/app/build/outputs/apk/debug/app-debug.apk Caixa_da_Loja.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caixa-da-Loja-APK
          path: Caixa_da_Loja.apk
          if-no-files-found: error
