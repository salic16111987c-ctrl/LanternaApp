name: Diagnose eWeLink Secrets

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-ewelink.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      ALL_REPO_SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Listar somente nomes de secrets relacionados ao projeto
        shell: bash
        run: |
          node <<'NODE'
          let data = {};
          try { data = JSON.parse(process.env.ALL_REPO_SECRETS_JSON || '{}'); } catch {}
          const names = Object.keys(data).filter(n => /EWELINK|COOLKIT|API|APP|CLIENT|VERCEL/i.test(n));
          console.log(JSON.stringify({matchingSecretNames:names,totalMatching:names.length}));
          NODE
