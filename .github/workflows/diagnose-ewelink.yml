name: Diagnose eWeLink OAuth

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/diagnose-ewelink.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar deploy Vercel
        run: sleep 25

      - name: Testar endpoint OAuth publicado
        run: |
          curl --fail-with-body --silent --show-error \
            'https://chegada-casa-api.vercel.app/api/oauth-start?state=diagnostico'
          echo
