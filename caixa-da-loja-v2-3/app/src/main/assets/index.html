<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#101828;--muted:#667085;--line:#e4e7ec;--navy:#0b1630;--green:#18b978;--red:#b42318;--shadow:0 10px 28px rgba(16,24,40,.08)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.center{min-height:100vh;display:grid;place-items:center;padding:24px}.login{width:min(520px,100%);text-align:center}.logo{width:76px;height:76px;margin:0 auto 16px;border-radius:23px;background:var(--navy);display:grid;place-items:center;color:#fff;font-size:28px;font-weight:900;box-shadow:var(--shadow)}.logo b{color:var(--green)}h1{margin:0 0 7px;font-size:38px;letter-spacing:-.04em}.sub{color:var(--muted);margin:0 0 22px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.form{display:grid;gap:14px;text-align:left}.field{display:grid;gap:7px}.field>span{font-size:13px;font-weight:750}.input,.money{min-height:53px;border:1px solid var(--line);border-radius:14px;background:#fafbfc}.input{width:100%;padding:0 13px;outline:none}.money{display:grid;grid-template-columns:30px 1fr;align-items:center;padding:0 13px;color:var(--muted)}.money input{min-width:0;border:0;outline:0;background:transparent;font-size:21px;font-weight:800;color:var(--ink)}.primary,.secondary,.danger{border-radius:13px;min-height:48px;font-weight:800;padding:0 15px}.primary{border:0;background:var(--navy);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.danger{border:1px solid #f1b4ad;background:#fff;color:var(--red)}button:disabled{opacity:.55;cursor:not-allowed}.topbar{height:76px;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:46px 1fr 46px;align-items:center;padding:0 14px;gap:8px}.topbar .who{text-align:center;min-width:0}.topbar small,.topbar strong{display:block}.topbar small{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topbar strong{font-size:20px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:13px}.mini{width:42px;height:42px;border-radius:13px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:900}.mini b{color:var(--green)}.content{width:min(980px,100%);margin:auto;padding:18px 14px 60px}.narrow{max-width:670px}.datebox{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:13px}.datebox span{color:var(--muted);font-size:13px;flex:1}.datebox input{border:0;background:transparent;font-weight:750;outline:0}.hero{background:var(--navy);color:#fff;border-radius:22px;padding:24px;margin-bottom:14px}.hero span,.hero small{display:block;opacity:.72}.hero strong{display:block;font-size:42px;letter-spacing:-.04em;margin:3px 0}.sum{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}.sum strong{color:var(--ink);font-size:20px}.note{font-size:12px;color:var(--green);text-align:center}.lock{border:1px solid #ffd5ad;background:#fff5ea;color:#8a451f;padding:12px;border-radius:13px;font-size:13px;line-height:1.4}.tabs{width:min(980px,100%);margin:auto;padding:12px 14px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tabs button{height:42px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:12px;font-weight:750}.tabs .on{background:var(--navy);color:#fff;border-color:var(--navy)}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px;box-shadow:var(--shadow)}.stat span,.stat strong,.stat small{display:block}.stat span,.stat small{color:var(--muted);font-size:11px}.stat strong{font-size:20px;margin:4px 0}.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.sectiontitle h2{font-size:21px;margin:0}.sectiontitle small{color:var(--muted)}.history{display:grid}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.row:first-child{border-top:0}.row span,.row small{display:block}.row small{color:var(--muted);margin-top:3px}.empty{text-align:center;color:var(--muted);padding:26px 8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.expense-head{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px}.expenses{display:grid;gap:8px}.expense{display:grid;grid-template-columns:1.3fr .8fr 42px;gap:7px}.expense .money{min-height:46px}.trash{border:1px solid var(--line);background:#fff;color:var(--red);border-radius:11px}.summary{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:13px;display:grid;gap:9px}.summary div{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.summary strong{color:var(--ink)}.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:30;background:#101828;color:#fff;padding:11px 15px;border-radius:13px;font-size:13px;font-weight:700;box-shadow:0 12px 35px rgba(0,0,0,.22);max-width:92%;text-align:center}.export{text-align:center;padding:30px 18px}.export .big{font-size:48px}.muted{color:var(--muted)}@media(max-width:650px){.tabs{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.expense{grid-template-columns:1fr 1fr 42px}.expense .desc{grid-column:1/-1}.actions{grid-template-columns:1fr}}

<script>
(()=>{'use strict';
const FV='12.3.0',CFG={apiKey:'AIzaSyAcMqWWeaEKfdjIST0NSwkXWWsbst6iY2k',authDomain:'caixa-da-loja-5dd34.firebaseapp.com',projectId:'caixa-da-loja-5dd34',storageBucket:'caixa-da-loja-5dd34.firebasestorage.app',messagingSenderId:'243340178302',appId:'1:243340178302:web:09e0bc0265edc2d2cab92f'};
const ADMIN='techellacs1@gmail.com',CAIXA='acsolar1611@gmail.com',app=document.getElementById('app'),fmt=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}),pad=n=>String(n).padStart(2,'0'),today=()=>{const d=new Date;return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())},month=()=>today().slice(0,7),br=s=>new Date(s+'T12:00:00').toLocaleDateString('pt-BR'),num=v=>Number(String(v||'').replace(/\./g,'').replace(',','.'))||0,esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let F,auth,db,user,role='caixa',movs=[],closings=[],stops=[],tab='lancamentos',period='hoje';
function toast(t,bad=false){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.textContent=t;if(bad)e.style.background='#b42318';document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function logo(){return '<div class="mini">R<b>$</b></div>'}function top(title){return '<header class="topbar"><button class="iconbtn" id="logout">↩</button><div class="who"><small>'+esc(user?.email||'')+'</small><strong>'+esc(title)+'</strong></div>'+logo()+'</header>'}function bindTop(){document.getElementById('logout')?.addEventListener('click',()=>F.signOut(auth))}
function stop(){stops.forEach(x=>{try{x()}catch(e){}});stops=[]}function byDate(d){return movs.find(x=>x.data===d)||null}
function login(){user=null;app.innerHTML='<main class="center"><section class="login"><div class="logo">R<b>$</b></div><h1>Caixa da Loja</h1><p class="sub">Entre com sua conta cadastrada.</p><form class="panel form" id="login"><label class="field"><span>E-mail</span><input class="input" id="email" type="email" required autocomplete="username"></label><label class="field"><span>Senha</span><input class="input" id="senha" type="password" required autocomplete="current-password"></label><button class="primary" id="entrar">Entrar</button><div class="note">☁ Firebase conectado</div></form></section></main>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('entrar');b.disabled=true;b.textContent='Entrando...';try{await F.signInWithEmailAndPassword(auth,document.getElementById('email').value.trim(),document.getElementById('senha').value)}catch(x){console.error(x);toast('E-mail ou senha incorretos.',true);b.disabled=false;b.textContent='Entrar'}}}
function listen(){stop();if(role==='caixa'){const r=F.doc(db,'movimentos',today());stops.push(F.onSnapshot(r,s=>{movs=s.exists()?[{id:s.id,...s.data()}]:[];renderCash()},e=>{console.error(e);toast('Sem acesso ao caixa de hoje.',true)}));return}const q=F.query(F.collection(db,'movimentos'),F.orderBy('data','desc'));stops.push(F.onSnapshot(q,s=>{movs=s.docs.map(d=>({id:d.id,...d.data()}));renderAdmin()},e=>{console.error(e);toast('Sem acesso aos lançamentos.',true)}));const qc=F.query(F.collection(db,'fechamentos'),F.orderBy('mes','desc'));stops.push(F.onSnapshot(qc,s=>{closings=s.docs.map(d=>({id:d.id,...d.data()}));renderAdmin()},e=>console.error(e)))}
function renderCash(){const d=today(),m=byDate(d),din=Number(m?.dinheiro||0),car=Number(m?.cartao||0),locked=!!m;app.innerHTML=top('Caixa')+'<main class="content narrow"><div class="datebox">📅 <span>Data</span><strong>'+br(d)+'</strong></div><section class="hero"><span>Total do dia</span><strong id="day">'+fmt.format(din+car)+'</strong><small>Dinheiro + cartão/PIX</small></section><form class="panel form" id="cash">'+(locked?'<div class="lock">🔒 Lançamento já realizado. Somente o Administrador pode alterar ou excluir.</div>':'')+'<label class="field"><span>Entrada em dinheiro</span><div class="money"><span>R$</span><input id="din" inputmode="decimal" '+(locked?'disabled':'')+' value="'+(din?din.toFixed(2).replace('.',','):'')+'" placeholder="0,00"></div></label><label class="field"><span>Entrada em cartão + PIX</span><div class="money"><span>R$</span><input id="car" inputmode="decimal" '+(locked?'disabled':'')+' value="'+(car?car.toFixed(2).replace('.',','):'')+'" placeholder="0,00"></div></label><div class="sum"><span>Soma</span><strong id="sum">'+fmt.format(din+car)+'</strong></div><button class="primary" '+(locked?'disabled':'')+'>'+(locked?'Lançamento bloqueado':'Fazer lançamento')+'</button><div class="note">☁ Sincronização online ativa</div></form></main>';bindTop();if(locked)return;const a=document.getElementById('din'),b=document.getElementById('car'),re=()=>{const t=num(a.value)+num(b.value);document.getElementById('sum').textContent=fmt.format(t);document.getElementById('day').textContent=fmt.format(t)};a.oninput=b.oninput=re;document.getElementById('cash').onsubmit=saveCash}
async function saveCash(e){e.preventDefault();if(role!=='caixa')return;const d=today(),din=num(document.getElementById('din').value),car=num(document.getElementById('car').value),r=F.doc(db,'movimentos',d);if(din<0||car<0)return toast('Informe valores válidos.',true);try{await F.runTransaction(db,async tx=>{const s=await tx.get(r);if(s.exists())throw new Error('exists');tx.set(r,{data:d,dinheiro:din,cartao:car,total:din+car,criadoPor:user.email||'',criadoEm:F.serverTimestamp(),atualizadoPor:user.email||'',atualizadoEm:F.serverTimestamp()})});toast('Lançamento salvo.') }catch(x){console.error(x);toast(x.message==='exists'?'O caixa de hoje já foi lançado.':'Não foi possível salvar.',true)}}
function tabs(){return '<nav class="tabs">'+[['lancamentos','Lançamentos'],['resumo','Resumo'],['fechamento','Fechamento'],['exportar','Exportar']].map(x=>'<button data-tab="'+x[0]+'" class="'+(tab===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</nav>'}
function renderAdmin(){if(role!=='admin')return;app.innerHTML=top('Administrador')+tabs()+(tab==='lancamentos'?adminMov():tab==='resumo'?summary():tab==='fechamento'?closing():exportView());bindTop();document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderAdmin()});bindAdmin()}
function adminMov(){const d=window.admDate||today(),m=byDate(d),din=Number(m?.dinheiro||0),car=Number(m?.cartao||0);return '<main class="content narrow"><section class="panel form"><div class="sectiontitle"><div><small>ACESSO TOTAL</small><h2>Lançamento</h2></div></div><div class="datebox">📅 <span>Data</span><input id="admDate" type="date" value="'+d+'"></div><label class="field"><span>Entrada em dinheiro</span><div class="money"><span>R$</span><input id="admDin" inputmode="decimal" value="'+(din?din.toFixed(2).replace('.',','):'')+'" placeholder="0,00"></div></label><label class="field"><span>Entrada em cartão + PIX</span><div class="money"><span>R$</span><input id="admCar" inputmode="decimal" value="'+(car?car.toFixed(2).replace('.',','):'')+'" placeholder="0,00"></div></label><div class="sum"><span>Total</span><strong id="admTotal">'+fmt.format(din+car)+'</strong></div><div class="actions"><button class="primary" id="admSave">'+(m?'Salvar correção':'Criar lançamento')+'</button><button class="danger" id="admDel" '+(m?'':'disabled')+'>Excluir lançamento</button></div></section><section class="panel" style="margin-top:14px"><div class="sectiontitle"><h2>Histórico</h2><small>'+movs.length+' lançamento(s)</small></div><div class="history">'+(movs.length?movs.map(x=>'<div class="row"><div><span><b>'+br(x.data)+'</b></span><small>Dinheiro '+fmt.format(Number(x.dinheiro||0))+' • Cartão/PIX '+fmt.format(Number(x.cartao||0))+'</small></div><strong>'+fmt.format(Number(x.total??(Number(x.dinheiro||0)+Number(x.cartao||0))))+'</strong></div>').join(''):'<div class="empty">Nenhum lançamento.</div>')+'</div></section></main>'}
async function adminSave(){if(role!=='admin')return;const d=document.getElementById('admDate').value,din=num(document.getElementById('admDin').value),car=num(document.getElementById('admCar').value);if(!d||din<0||car<0)return toast('Confira os valores.',true);try{await F.setDoc(F.doc(db,'movimentos',d),{data:d,dinheiro:din,cartao:car,total:din+car,atualizadoPor:user.email||'',atualizadoEm:F.serverTimestamp()},{merge:true});toast('Lançamento salvo.')}catch(x){console.error(x);toast('Não foi possível salvar.',true)}}
async function adminDel(){if(role!=='admin')return;const d=document.getElementById('admDate').value;if(!byDate(d)||!confirm('Excluir o lançamento de '+br(d)+'?'))return;try{await F.deleteDoc(F.doc(db,'movimentos',d));toast('Lançamento excluído.')}catch(x){console.error(x);toast('Não foi possível excluir.',true)}}
function filtered(){const t=today(),mo=t.slice(0,7);if(period==='hoje')return movs.filter(x=>x.data===t);if(period==='mes')return movs.filter(x=>x.data?.slice(0,7)===mo);if(period==='ano')return movs.filter(x=>x.data?.slice(0,4)===t.slice(0,4));return movs}
function summary(){const a=filtered(),din=a.reduce((s,x)=>s+Number(x.dinheiro||0),0),car=a.reduce((s,x)=>s+Number(x.cartao||0),0);return '<main class="content"><div class="tabs" style="padding:0 0 13px">'+[['hoje','Hoje'],['mes','Mês'],['ano','Ano'],['tudo','Tudo']].map(x=>'<button data-period="'+x[0]+'" class="'+(period===x[0]?'on':'')+'">'+x[1]+'</button>').join('')+'</div><div class="grid3"><div class="stat"><span>Dinheiro</span><strong>'+fmt.format(din)+'</strong><small>'+a.length+' dia(s)</small></div><div class="stat"><span>Cartão + PIX</span><strong>'+fmt.format(car)+'</strong><small>período selecionado</small></div><div class="stat"><span>Total</span><strong>'+fmt.format(din+car)+'</strong><small>entradas</small></div></div><section class="panel"><div class="sectiontitle"><h2>Movimentação</h2></div><div class="history">'+(a.length?a.map(x=>'<div class="row"><div><b>'+br(x.data)+'</b><small>'+fmt.format(Number(x.dinheiro||0))+' dinheiro • '+fmt.format(Number(x.cartao||0))+' cartão/PIX</small></div><strong>'+fmt.format(Number(x.total??(Number(x.dinheiro||0)+Number(x.cartao||0))))+'</strong></div>').join(''):'<div class="empty">Sem lançamentos neste período.</div>')+'</div></section></main>'}
function getClose(m){return closings.find(x=>x.mes===m)||null}function monthEntries(m){return movs.filter(x=>x.data?.slice(0,7)===m).reduce((s,x)=>s+Number(x.total??(Number(x.dinheiro||0)+Number(x.cartao||0))),0)}
function expRow(x={descricao:'',valor:0}){return '<div class="expense"><input class="input desc" data-desc value="'+esc(x.descricao||'')+'" placeholder="Descrição"><div class="money"><span>R$</span><input data-val inputmode="decimal" value="'+(Number(x.valor||0)?Number(x.valor).toFixed(2).replace('.',','):'')+'" placeholder="0,00"></div><button class="trash" data-rm>×</button></div>'}
function closing(){const m=window.closeMonth||month(),c=getClose(m)||{},ex=Array.isArray(c.despesas)&&c.despesas.length?c.despesas:[{descricao:'',valor:0}],luc=Number(c.lucro||0),et=ex.reduce((s,x)=>s+Number(x.valor||0),0);return '<main class="content narrow"><section class="panel form"><div class="sectiontitle"><div><small>FECHAMENTO</small><h2>Resultado mensal</h2></div></div><label class="field"><span>Mês</span><input class="input" id="closeMonth" type="month" value="'+m+'"></label><label class="field"><span>Lucro informado</span><div class="money"><span>R$</span><input id="lucro" inputmode="decimal" value="'+(luc?luc.toFixed(2).replace('.',','):'')+'" placeholder="0,00"></div></label><div class="expense-head"><b>Despesas mensais</b><button class="secondary" id="addExp">+ Adicionar</button></div><div class="expenses" id="expenses">'+ex.map(expRow).join('')+'</div><div class="summary"><div><span>Entradas do mês</span><strong>'+fmt.format(monthEntries(m))+'</strong></div><div><span>Despesas</span><strong id="expTotal">'+fmt.format(et)+'</strong></div><div><b>Resultado líquido</b><strong id="net">'+fmt.format(luc-et)+'</strong></div></div><button class="primary" id="saveClose">Salvar fechamento</button></section></main>'}
function readExp(){return [...document.querySelectorAll('.expense')].map(r=>({descricao:r.querySelector('[data-desc]').value.trim(),valor:num(r.querySelector('[data-val]').value)})).filter(x=>x.descricao||x.valor)}function recalc(){const e=readExp(),t=e.reduce((s,x)=>s+x.valor,0),l=num(document.getElementById('lucro')?.value);if(document.getElementById('expTotal'))document.getElementById('expTotal').textContent=fmt.format(t);if(document.getElementById('net'))document.getElementById('net').textContent=fmt.format(l-t)}
async function saveClose(){const m=document.getElementById('closeMonth').value,l=num(document.getElementById('lucro').value),e=readExp(),t=e.reduce((s,x)=>s+x.valor,0);try{await F.setDoc(F.doc(db,'fechamentos',m),{mes:m,lucro:l,despesas:e,despesasTotal:t,resultadoLiquido:l-t,atualizadoPor:user.email||'',atualizadoEm:F.serverTimestamp()},{merge:true});toast('Fechamento salvo.')}catch(x){console.error(x);toast('Não foi possível salvar.',true)}}
function exportView(){return '<main class="content narrow"><section class="panel export"><div class="big">▦</div><h2>Planilha do Caixa</h2><p class="muted">Exporta lançamentos e fechamentos salvos no Firebase.</p><p><b>'+movs.length+'</b> lançamento(s) • <b>'+closings.length+'</b> fechamento(s)</p><button class="primary" id="export" style="width:100%">Baixar Excel (.xls)</button></section></main>'}
function cell(v,t='String'){return '<Cell><Data ss:Type="'+t+'">'+String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</Data></Cell>'}function exportXls(){const rm=movs.slice().sort((a,b)=>String(a.data).localeCompare(String(b.data))).map(x=>'<Row>'+cell(x.data)+cell(Number(x.dinheiro||0),'Number')+cell(Number(x.cartao||0),'Number')+cell(Number(x.total??(Number(x.dinheiro||0)+Number(x.cartao||0))),'Number')+cell(x.atualizadoPor||x.criadoPor||'')+'</Row>').join(''),rc=closings.slice().sort((a,b)=>String(a.mes).localeCompare(String(b.mes))).map(x=>'<Row>'+cell(x.mes)+cell(Number(x.lucro||0),'Number')+cell(Number(x.despesasTotal||0),'Number')+cell(Number(x.resultadoLiquido??0),'Number')+cell((x.despesas||[]).map(y=>y.descricao+': '+fmt.format(Number(y.valor||0))).join(' | '))+'</Row>').join(''),xml='<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Lançamentos"><Table><Row>'+cell('Data')+cell('Dinheiro')+cell('Cartão + PIX')+cell('Total')+cell('Atualizado por')+'</Row>'+rm+'</Table></Worksheet><Worksheet ss:Name="Fechamentos"><Table><Row>'+cell('Mês')+cell('Lucro')+cell('Despesas')+cell('Resultado líquido')+cell('Detalhes')+'</Row>'+rc+'</Table></Worksheet></Workbook>',name='caixa-da-loja-'+today()+'.xls';try{if(window.Android?.saveBase64File){const bytes=new TextEncoder().encode(xml);let bin='';for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode(...bytes.subarray(i,i+32768));window.Android.saveBase64File(name,'application/vnd.ms-excel',btoa(bin));toast('Planilha salva em Downloads.');return}}catch(e){console.error(e)}const blob=new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
