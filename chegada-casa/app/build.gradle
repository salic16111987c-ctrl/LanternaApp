plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cilassouza.chegadacasa'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cilassouza.chegadacasa.v2'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '1.6-fast-arrival'
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
}
