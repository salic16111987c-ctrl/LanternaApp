plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('CHEGADA_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('CHEGADA_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('CHEGADA_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CHEGADA_KEY_PASSWORD')

android {
    namespace 'com.cilassouza.chegadacasa'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cilassouza.chegadacasa.fast'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '3.0-rc2-comercial'
    }

    signingConfigs {
        debug {
            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
