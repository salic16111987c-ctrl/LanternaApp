plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cilassouza.chegadacasa'
    compileSdk 35

    defaultConfig {
        applicationId 'com.cilassouza.chegadacasa.fast'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.9-simulacao-chegada'
    }

    // The keystore itself is private and restored securely by GitHub Actions.
    // Never commit it to this public repository or generate a new key per build.
    signingConfigs {
        debug {
            storeFile file(System.getenv('HOME') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
}
